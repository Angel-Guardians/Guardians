# preferIPv4Stack: this host has no working IPv6 route, and the JVM otherwise
# tries IPv6 first for dl.google.com → "Network is unreachable: getsockopt" and
# dependency resolution fails. Forcing IPv4 at JVM start fixes downloads.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Slow/selective network: give dependency downloads more headroom than the default.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# Optional: bake a default backend base URL into the app so you don't have to
# type it on the watch. Example:
#   guardian.baseUrl=http://192.168.1.50:8000
# Leave unset to configure it on-device in Settings.
# guardian.baseUrl=
