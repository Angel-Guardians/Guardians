# preferIPv6Addresses: this host's IPv4 route is broken (JVM gets
# "Network is unreachable: getsockopt" / UnknownHostException), but IPv6 works.
# The JVM tries IPv4 first by default, so dependency downloads fail. Preferring
# IPv6 addresses points resolution at the route that actually works.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv6Addresses=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Slow/selective network: give dependency downloads more headroom than the default.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# Optional: bake a default backend base URL into the app so you don't have to
# type it on the watch. Example:
#   guardian.baseUrl=http://192.168.1.50:8000
# Leave unset to configure it on-device in Settings.
# guardian.baseUrl=
