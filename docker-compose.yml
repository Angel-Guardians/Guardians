# Optional services. Guardian runs on SQLite with no Docker; bring this up only
# for the pgvector RAG upgrade:  docker compose up -d postgres
services:
  postgres:
    image: pgvector/pgvector:pg17     # Postgres 17 with the pgvector extension preinstalled
    container_name: guardian-postgres
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    ports:
      - "5432:5432"
    volumes:
      - guardian-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  guardian-pgdata:
