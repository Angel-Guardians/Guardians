# Guardian full stack.
#   docker compose up --build            -> backend (API) + frontend (UI)
#   docker compose --profile rag up -d postgres   -> optional pgvector RAG store
#   docker compose run --rm backend pytest         -> run the test suite
services:
  backend:
    build:
      # Repo root so the image can bundle backend + scripts + scenarios + tests.
      context: .
      dockerfile: backend/Dockerfile
    container_name: guardian-backend
    env_file:
      - .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite DB and any grounded-data snapshots across restarts.
      - guardian-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time. Point at the host-exposed
        # backend port (the browser, not the container, makes these calls).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: guardian-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg17     # Postgres 17 with the pgvector extension preinstalled
    container_name: guardian-postgres
    profiles: ["rag"]                 # opt-in: docker compose --profile rag up -d postgres
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    ports:
      - "5432:5432"
    volumes:
      - guardian-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  guardian-pgdata:
  guardian-data:
