[project]
name = "guardian"
version = "0.2.0"
description = "Home Emergency AI Companion — multi-agent, provider-neutral LLM, runs on OpenAI cloud or a local DGX Spark"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    # --- Brain (provider-neutral LLM + orchestration + tracing) ---
    "openai>=1.0",          # the ONLY vendor SDK, confined to backend/llm/openai_compatible.py
    "langgraph>=0.2",       # supervisor -> 6 specialists StateGraph
    "langsmith>=0.2",       # optional tracing (env-gated by LANGSMITH_TRACING)
    "python-dotenv>=1.0",
    "loguru>=0.7",
    # --- Spine (API + DB + SSE + config) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",  # Postgres driver (only needed when DATABASE_URL points at Postgres)
    "apscheduler>=3.10",     # medication reminder scheduling
    # Numerics (shared)
    "numpy>=2.1",
    # Wearable
    "bleak>=0.22",
    # External integrations
    "twilio>=9.3",
    "fhir.resources>=7.1",
    "httpx>=0.27",
    # Lab records (PDF parsing + multipart upload)
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
    # Reasoning
    "river>=0.21",
]

[project.optional-dependencies]
# Always-on audio tier (STT/wake-word) + Kokoro TTS.
#
# NOTE on Kokoro + Python 3.13: `kokoro>=0.7` pins `numpy==1.26.4`, which has no
# 3.13 wheel and conflicts with our core `numpy>=2.1`. Kokoro runs fine on numpy
# 2.x, so on 3.13 install it without its deps and add the runtime ones explicitly:
#
#   pip install kokoro==0.7.4 --no-deps
#   pip install num2words "spacy" phonemizer-fork espeakng-loader soundfile --only-binary=:all:
#
# (spacy auto-downloads en_core_web_sm + the Kokoro-82M weights on first synth.)
# On Linux / the DGX Spark target, plain `pip install -e ".[audio]"` works.
# If Kokoro can't load, backend/voice/tts.py falls back to OpenAI TTS automatically.
audio = [
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "openwakeword>=0.6",
    "kokoro>=0.7",
    "soundfile>=0.12",
]
# MyCareCompass portal automation (LifeLabs has no public patient API).
crawler = [
    "playwright>=1.47",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "ipython>=8.28",
    "httpx>=0.27",           # TestClient
]
# Optional RAG upgrade: real embeddings + pgvector. Keyword recall works without these.
rag = [
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
]

[project.scripts]
guardian-backend = "backend.main:run"
guardian-phase0 = "scripts.phase0:main"
guardian-seed = "backend.db.seed:seed_all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
