[project]
name = "guardian"
version = "0.1.0"
description = "Home Emergency AI Companion - always-on, fully local"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    # Backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Persistence
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "influxdb-client>=1.46",
    # Agents / LLM
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    # Scheduling / workers
    "apscheduler>=3.10",
    "arq>=0.26",
    # Observability
    "loguru>=0.7",
    # Numerics (shared)
    "numpy>=2.1",
    # Wearable
    "bleak>=0.22",
    # External integrations
    "twilio>=9.3",
    "fhir.resources>=7.1",
    "httpx>=0.27",
    # Reasoning
    "river>=0.21",
]

[project.optional-dependencies]
# Always-on audio tier (STT/wake-word/TTS). Kept optional because kokoro
# currently constrains numpy and its misaki dep has no wheel on some platforms.
audio = [
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "openwakeword>=0.6",
    "kokoro>=0.7",
]
rag = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "ipython>=8.28",
]

[project.scripts]
guardian-backend = "backend.main:run"
guardian-always-on = "backend.always_on.runner:run"
guardian-workers = "backend.workers.runner:run"
guardian-seed = "scripts.seed_patient:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
