[project]
name = "guardian"
version = "0.1.0"
description = "Home Emergency AI Companion - always-on, fully local"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    # LLM
    "openai>=1.0",
    # Orchestration
    "langgraph>=0.2",
    # Observability
    "langsmith>=0.2",
    # Config
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "ipython>=8.28",
]

[project.scripts]
guardian-phase0 = "scripts.phase0:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
